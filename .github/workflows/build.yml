name: Build APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Publish latest APK') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ApprovedBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK into repository for browser download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk website/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/app-debug.apk
          if git diff --cached --quiet; then
            echo "APK is already current"
          else
            git commit -m "Publish latest APK for browser download"
            git push origin HEAD:main
          fi
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "Approved Browser latest" --notes "Latest browser installer APK"
