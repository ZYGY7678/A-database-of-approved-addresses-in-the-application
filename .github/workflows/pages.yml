name: Deploy Approved Browser Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare latest APK for same-origin download
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/ZYGY7678/A-database-of-approved-addresses-in-the-application/releases/download/latest/app-debug.apk" \
            -o website/app-debug.apk
          test -s website/app-debug.apk
          ls -lh website/app-debug.apk

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
